name: CI

on:
  pull_request:
  push:
    branches: [main]

# A PR only needs its latest commit checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and check site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build _site/
        run: npm run build

      - name: Check assets, anchors, a11y, meta, i18n
        run: npm run check

      - name: Upload built site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/
          retention-days: 7
